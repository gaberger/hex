[package]
name = "ebay-clone-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Additions for the eBay clone backend
hex-nexus/backend/core/domain = { path = "../core/domain" }
hex-nexus/backend/core/ports = { path = "../core/ports" }
hex-nexus/backend/core/usecases = { path = "../core/usecases" }
hex-nexus/backend/adapters/primary = { path = "../adapters/primary" }
hex-nexus/backend/adapters/secondary = { path = "../adapters/secondary" }