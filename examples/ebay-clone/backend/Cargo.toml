[package]
name = "ebay-clone-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
# domain — pure data, no IO
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# ports — async trait contracts
async-trait = "0.1"

# adapters — concrete implementations
tokio = { version = "1", features = ["full"] }
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"

# http primary adapter
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# crypto adapters for auth
zeroize = "1.5" # ADR-2026-05-19-0721

[dev-dependencies]
tokio-test = "0.4"
spacetimedb = { version = "0.1", features = ["in-memory"] }
test-harness = "0.1"

# New dependencies for acceptance test
fantoccini = "0.23"
assert_cmd = "1.0"