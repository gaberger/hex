[package]
name = "marketplace"
version = "0.1.0"
edition = "2021"

[dependencies]
spacetime = { git = "https://github.com/hex-core/spacetime-modules", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[lib]
crate-type = ["cdylib"]

# Standalone package: the repo-root workspace captures this path but does not
# list it as a member, so an empty [workspace] table keeps it out (was the
# "believes it's in a workspace when it's not" error). NOTE: the module source
# is still a hallucinated stub (prose in lib.rs, a bogus `spacetime` git dep
# instead of `spacetimedb = "1.0"`) and needs a real rewrite to compile.
[workspace]

# docs/specs/ebay-spec-006, ebay-spec-012, ebay-spec-016, ebay-spec-018, ebay-spec-020
# spacetime-modules/marketplace/Cargo.toml