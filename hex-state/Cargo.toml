[package]
name = "hex-state"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
# `real` STDB adapter vs a no-op `stub` (for builds without SpacetimeDB).
# Mirrors the gate that lived in hex-nexus; default-on so the real impl ships.
default = ["spacetimedb"]
spacetimedb = []

[dependencies]
hex-core = { path = "../hex-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
httpmock = "0.7"
regex = "1"
